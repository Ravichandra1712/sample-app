steps:
- name: 'gcr.io/cloud-builders/go'
  args: ['build', '-o', 'main', 'main.go']
  env: ['PROJECT_ROOT=sample-app']
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-east4-docker.pkg.dev/qwiklabs-gcp-02-590b4c3aaf6d/my-repository/sample-app:v1.0', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-east4-docker.pkg.dev/qwiklabs-gcp-02-590b4c3aaf6d/my-repository/sample-app:v1.0']
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['apply', '-f', 'dev/deployment.yaml', '-n', 'dev']
  env:
  - 'CLOUDSDK_COMPUTE_ZONE=us-east4-c'
  - 'CLOUDSDK_CONTAINER_CLUSTER=hello-cluster'
images:
- 'us-east4-docker.pkg.dev/qwiklabs-gcp-02-590b4c3aaf6d/my-repository/sample-app:v1.0'
