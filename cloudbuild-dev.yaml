steps:
- name: 'gcr.io/cloud-builders/go'
  args: ['build', '-o', 'main', 'main.go']
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-east4-docker.pkg.dev/$PROJECT_ID/my-repository/sample-app:v1.0', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-east4-docker.pkg.dev/$PROJECT_ID/my-repository/sample-app:v1.0']
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['container', 'clusters', 'get-credentials', 'hello-cluster', '--zone', 'us-east4-c']
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['apply', '-f', 'dev/deployment.yaml', '-n', 'dev']
images:
- 'us-east4-docker.pkg.dev/$PROJECT_ID/my-repository/sample-app:v1.0'
